name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Runs every time you push to the main branch
  workflow_dispatch: # Allows manual runs from the Actions tab

permissions:
  contents: write # Allows the action to push to the gh-pages branch

# Prevent overlapping deploys from racing each other
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # dist for vite
          branch: gh-pages # The branch the action will push the build to

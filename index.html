      content="An interactive instrument for learning the 400G, 800G and 1.6T Ethernet PHY stack, one sublayer at a time."
    />
    <title>Ethernet Onboarding</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong ground.
      (function () {
        try {
          var saved = localStorage.getItem("eos-theme");
          var t =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

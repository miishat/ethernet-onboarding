    <title>Ethernet Onboarding</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong ground.
      (function () {
        try {
          var saved = localStorage.getItem("eos-theme");
          var t = saved === "dark" || saved === "warm" ? saved : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
